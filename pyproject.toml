[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trader"
version = "0.2.0"
description = "Local macOS paper backtesting app for opening-range breakout strategies"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "pywebview>=5,<7; sys_platform == 'darwin'",
    "keyring>=25,<27; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["black>=24.10", "pillow>=10", "pyinstaller>=6.11"]

[tool.black]
line-length = 88

[tool.setuptools]
py-modules = ["strategy"]
